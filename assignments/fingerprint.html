<!DOCTYPE html>
<html>

<head>
  <title>User Identification</title>
</head>

<body>
  <h2>User Identification Snapshot</h2>
  <pre id="output"></pre>
  <div id="iframe-container"></div>

  <script>
    function getUserFingerprint() {
      const fingerprint = {
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        screenResolution: screen.width + "x" + screen.height,
        colorDepth: screen.colorDepth,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        cookiesEnabled: navigator.cookieEnabled,
        localStorage: !!window.localStorage,
        sessionStorage: !!window.sessionStorage,
        hardwareConcurrency: navigator.hardwareConcurrency,
        deviceMemory: navigator.deviceMemory || "Unknown",
        touchSupport: 'ontouchstart' in window,
      };

      return fingerprint;
    }

    const fingerprint = getUserFingerprint();
    document.getElementById("output").textContent = JSON.stringify(fingerprint, null, 2);

    const iframe = document.createElement('iframe');

    iframe.src = "http://gaia.cs.umass.edu/wireshark-labs/INTRO-wireshark-file1.html";
    iframe.width = "100%";
    iframe.height = "100%";
    iframe.style.border = "none";
    iframe.frameBorder = "0";

    const container = document.getElementById('iframe-container');

    container.innerHTML = '';
    container.appendChild(iframe);
  </script>
</body>

</html>
